name: Open Issues Tests - .NET Core

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - report
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: '0 2 * * 1' # Weekly on Monday at 2 AM UTC

jobs:
  run-open-issues-dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout IssueRunner
        uses: actions/checkout@v4
        with:
          repository: nunit/nunit.tools.issuerunner
          path: _tools/issuerunner

      - name: Create the local feed folders
        # Many repros list c:\nuget as a package source for unreleased adapters. Restore fails when the
        # folder is missing, so create it empty. On Linux NuGet reads it as a folder next to the NuGet.config.
        run: |
          grep -rilE --include='[Nn]u[Gg]et.config' 'value="c:\\nuget"' . | while IFS= read -r f; do
            v=$(grep -ioE 'value="c:\\nuget"' "$f" | head -1 | cut -d'"' -f2)
            mkdir -p "$(dirname "$f")/$v"
          done

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
            6.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json', '**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build IssueRunner
        run: |
          dotnet build _tools/issuerunner/IssueRunner.Cli/IssueRunner.Cli.csproj -c Release

      - name: Run open issues tests (.NET Core)
        continue-on-error: true
        run: |
          cd _tools/issuerunner/IssueRunner.Cli/bin/Release/net10.0
          ./IssueRunner.Cli run --scope Open --skip-netfx --timeout 900 --nunit-only --root $GITHUB_WORKSPACE

      - name: Generate test report
        if: always()
        run: |
          cd _tools/issuerunner/IssueRunner.Cli/bin/Release/net10.0
          ./IssueRunner.Cli report generate --root $GITHUB_WORKSPACE

      - name: Publish summary
        if: always()
        run: |
          cat TestReport.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-open-results
          path: |
            results.json
            TestResults-consolelog.md
            TestReport.md
          if-no-files-found: error
